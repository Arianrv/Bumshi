# golangci-lint configuration (schema v2).
#
# v2 restructured the file: formatters moved out of `linters`, `linters-settings`
# became `linters.settings`, `issues.exclude-rules` became
# `linters.exclusions.rules`, and `gosimple` was merged into `staticcheck`.

version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      # This service IS a web proxy: every upstream request targets a URL the
      # user supplied, and every response body is third-party content relayed
      # back verbatim. gosec's taint analysis flags both by construction, on
      # every call site, forever. SSRF is prevented where it actually can be —
      # at dial time, by the internal/proxy/ssrfguard net.Dialer.Control hook,
      # which inspects the resolved IP and refuses anything non-public (so it
      # also defeats DNS rebinding). Response bodies are relayed, not rendered
      # by us. Keep every other gosec rule on.
      excludes:
        - G704 # SSRF via taint analysis
        - G705 # XSS via taint analysis
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bumshi/bumshi

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
