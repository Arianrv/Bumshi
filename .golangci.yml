# golangci-lint configuration (schema v2).
#
# v2 restructured the file: formatters moved out of `linters`, `linters-settings`
# became `linters.settings`, `issues.exclude-rules` became
# `linters.exclusions.rules`, and `gosimple` was merged into `staticcheck`.

version: "2"

run:
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    errcheck:
      exclude-functions:
        - (*strings.Builder).WriteString
        - (*strings.Builder).WriteByte
        - (*strings.Builder).WriteRune
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bumshi/bumshi

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
