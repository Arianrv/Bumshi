run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - gofmt
    - goimports
    - misspell
    - revive
    - bodyclose
    - gosec
    - unconvert
    - unparam
    - nolintlint

linters-settings:
  errcheck:
    exclude-functions:
      - (*strings.Builder).WriteString
      - (*strings.Builder).WriteByte
      - (*strings.Builder).WriteRune
      - fmt.Fprintf
      - fmt.Fprintln
  goimports:
    local-prefixes: github.com/bumshi/bumshi
  revive:
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck
        - unparam
  max-issues-per-linter: 0
  max-same-issues: 0
